name: Publish to Comfy Registry
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version matching pyproject.toml (X.Y.Z)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  regression-checks:
    uses: ./.github/workflows/ci.yml
  publish-node:
    needs: regression-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify release identity and publisher
        run: python tools/check_release.py --publish
      - name: Verify version and secret
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          python - <<'PYCODE'
          import os, tomllib
          with open('pyproject.toml', 'rb') as stream:
              version = tomllib.load(stream)['project']['version']
          assert version == os.environ['EXPECTED_VERSION'], 'Requested version differs from pyproject.toml'
          assert os.environ.get('TOKEN'), 'Set REGISTRY_ACCESS_TOKEN in repository Actions secrets'
          PYCODE
      - name: Preserve non-ASCII example filenames in official packer
        run: git config --local core.quotepath false
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: true
