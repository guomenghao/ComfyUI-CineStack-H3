name: CineStack regression checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install numpy pillow
      - run: python tools/check_release.py
      - run: python -m unittest discover -s tests -p 'test_segment_seed_refine_only.py' -v
      - run: python -m unittest discover -s tests -p 'test_cinestack_release.py' -v
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/test_segment_seed_frontend.mjs
